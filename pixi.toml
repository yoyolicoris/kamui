[workspace]
name = "kamui"
description = "Robust and accurate phase unwrapping on 2-D, 3-D, or sparse data"
authors = ["Chin-Yun Yu <chin-yun.yu@qmul.ac.uk>"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = ">=3.10,<3.15"
pip = "*"
numpy = ">=2"
scipy = "*"

[pypi-dependencies]
kamui = { path = ".", editable = true }

# Split from `dev` so the per-Python environments below can carry the test
# runner without the tooling: numpydoc >=1.11 requires Python >=3.11, which
# would make a 3.10 environment unsolvable.
[feature.test.dependencies]
pytest = "*"
pytest-cov = ">=7.1.0, <8"

# PyMaxflow is on conda-forge but has no osx-arm64 build, so it comes from
# PyPI; this keeps the PUMA graph-cut solver exercised in CI. PyPI has wheels
# up to Python 3.13; on 3.14 it builds from the sdist, which needs a C++
# compiler (present on every GitHub-hosted runner).
[feature.test.pypi-dependencies]
PyMaxflow = "*"

[feature.dev.dependencies]
ruff = "*"
python-build = "*"
numpydoc = ">=1.11.0,<2"

# One feature per supported interpreter, so CI can run the suite across the
# whole `requires-python` range instead of whatever the solver happens to pick.
[feature.py310.dependencies]
python = "3.10.*"
# conda-forge's only SciPy 1.15 builds (1.15.0-1.15.2) run HiGHS hundreds of
# times slower on kamui's programs: about 5 s for a 32x32 grid, against 10 ms
# for the PyPI wheels and for other conda-forge releases (measured on
# osx-arm64). The README examples would take hours there, so stay on 1.14.
scipy = "<1.15"

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"

[environments]
# Pinned to the newest Python with PyMaxflow wheels, so the lint, build and
# release jobs never compile it; py314 below covers 3.14.
default = ["py313", "test", "dev"]
py310 = ["py310", "test"]
py311 = ["py311", "test"]
py312 = ["py312", "test"]
py313 = ["py313", "test"]
py314 = ["py314", "test"]

[tasks]
test = { cmd = "pytest -v --cov --cov-branch --cov-report=term-missing --cov-report=xml", description = "Run the test suite, enforce full coverage, and write coverage.xml" }
lint = { cmd = "ruff check kamui tests scripts", description = "Lint with ruff" }
docstrings = { cmd = "python -m numpydoc lint kamui/*.py", description = "Validate public docstrings against numpydoc" }
format = { cmd = "ruff format kamui tests scripts", description = "Format with ruff" }
format-check = { cmd = "ruff format --check kamui tests scripts", description = "Fail if any file needs reformatting" }
build = { cmd = "python -m build", description = "Build sdist and wheel" }
smoke = { cmd = "python scripts/smoke_wheel.py", description = "Install the built wheel in a clean venv and check its version wiring" }
